name: Build sagemaker-code-editor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISABLE_V8_COMPILE_CACHE: 1

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ libx11-dev xorg-dev libxkbfile-dev libsecret-1-dev krb5-multidev python3 jq perl gettext automake autoconf quilt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vscode dependencies
        run: |
          cd vscode
          yarn install --frozen-lockfile

      - name: Build vscode
        run: |
          cd vscode
          export DISABLE_V8_COMPILE_CACHE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export UV_THREADPOOL_SIZE=4
          npm i -g node-gyp
          yarn build

      - name: Build main project
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn build

      - name: Package release
        run: |
          tar -czf package.tar.gz release || echo "No release dir, skipping tar"

      - name: Upload npm package artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ./package.tar.gz