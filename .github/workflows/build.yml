name: Build and Release sagemaker-code-editor

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (include "v", e.g. "v1.2.3")'
        required: true
        type: string

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DISABLE_V8_COMPILE_CACHE: 1

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ libx11-dev xorg-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python3 jq perl gettext automake autoconf quilt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            vscode/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('vscode/package.json', 'vscode/yarn.lock') }}

      - name: Apply patches (if any)
        run: |
          if [ -d patches ] && [ "$(ls -A patches)" ]; then
            quilt push -a || true
          fi

      - name: Get and set VERSION
        id: version
        run: |
          VER="${{ github.event.inputs.version }}"
          # Strip leading "v" if present, for use in file naming
          SHORTVER="${VER#v}"
          echo "VERSION=$VER" >> $GITHUB_ENV
          echo "SHORTVER=$SHORTVER" >> $GITHUB_ENV

      - name: Build vscode
        run: |
          cd vscode
          export DISABLE_V8_COMPILE_CACHE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export UV_THREADPOOL_SIZE=4
          npm i -g node-gyp
          yarn install --network-concurrency 1
          VSCODE_RIPGREP_VERSION=$(jq -r '.dependencies."@vscode/ripgrep"' package.json)
          mv package.json package.json.orig
          jq 'del(.dependencies."@vscode/ripgrep")' package.json.orig > package.json
          yarn install
          yarn add --ignore-scripts "@vscode/ripgrep@${VSCODE_RIPGREP_VERSION}"
          ARCH_ALIAS=linux-x64
          yarn gulp vscode-reh-web-${ARCH_ALIAS}-min
          cd ..
          TARBALL="vscode-reh-web-linux-x64-min-${SHORTVER}.tar.gz"
          tar czf $TARBALL -C vscode vscode-reh-web-linux-x64-min

      - name: List vscode directory after build
        run: ls -lh vscode

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-reh-web-linux-x64-min-${{ env.SHORTVER }}
          path: vscode-reh-web-linux-x64-min-${{ env.SHORTVER }}.tar.gz

      - name: Create GitHub Release and upload tarball
        uses: softprops/action-gh-release@v2
        with:
          name: sagemaker-code-editor ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          files: vscode-reh-web-linux-x64-min-${{ env.SHORTVER }}.tar.gz