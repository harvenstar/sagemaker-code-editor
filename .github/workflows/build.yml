name: Build and Release sagemaker-code-editor

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (include "v", e.g. "v1.2.3")'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc g++ libx11-dev xorg-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python3 jq perl gettext automake autoconf quilt

      - name: Get and set VERSION
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "VERSION=${TAG#v}" >> $GITHUB_ENV
          echo "TAG=${TAG}" >> $GITHUB_ENV

      - name: Build sagemaker-code-editor
        run: |
          cd vscode
          export DISABLE_V8_COMPILE_CACHE=1
          export NODE_OPTIONS="--max-old-space-size=4096"
          export UV_THREADPOOL_SIZE=4
          npm i -g node-gyp
          yarn install --network-concurrency 1
          VSCODE_RIPGREP_VERSION=$(jq -r '.dependencies."@vscode/ripgrep"' package.json)
          mv package.json package.json.orig
          jq 'del(.dependencies."@vscode/ripgrep")' package.json.orig > package.json
          yarn install
          yarn add --ignore-scripts "@vscode/ripgrep@${VSCODE_RIPGREP_VERSION}"
          ARCH_ALIAS=linux-x64
          yarn gulp vscode-reh-web-${ARCH_ALIAS}-min
          cd ..
          TARBALL="sagemaker-code-editor-${VERSION}-linux-x64.tar.gz"
          tar czf $TARBALL -C vscode vscode-reh-web-linux-x64-min

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: sagemaker-code-editor ${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          files: sagemaker-code-editor-${{ env.VERSION }}-linux-x64.tar.gz